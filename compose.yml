services:
  rabbitmq:
    image: rabbitmq:management-alpine
    ports:
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - data:/var/lib/rabbitmq
    restart: unless-stopped
    networks:
      - net

volumes:
  data:

networks:
  net:
    name: ${NETWORK}
    external: true